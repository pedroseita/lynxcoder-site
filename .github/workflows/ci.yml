name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: HTML, links e comportamento do nginx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar HTML
        run: npx --yes html-validate "src/**/*.html"

      - name: Sintaxe dos scripts
        run: for f in scripts/*.sh; do bash -n "$f"; done

      # Apanha href="#", âncoras inexistentes e ficheiros referenciados que não
      # existem — foi assim que os links mortos do footer passaram meses sem dar
      # por isso.
      # Versão do lychee pinada: entre versões mudam flags (--exclude-mail foi
      # removida; e-mails já são ignorados por omissão).
      # --root-dir/--index-files/--fallback-extensions resolvem links "/...",
      # "/#ancora" e URLs sem extensão (/comecar) como o nginx.
      # /api/contato e /api/onboarding são endpoints POST da API, não ficheiros de src/.
      # O próprio domínio fica de fora: os links internos já são verificados nos
      # ficheiros, e o CI não pode falhar só porque o site está em manutenção.
      - name: Verificar links
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: >-
            --no-progress
            --include-fragments
            --root-dir "${{ github.workspace }}/src"
            --index-files index.html
            --fallback-extensions html
            --exclude '/api/(contato|onboarding)$'
            --exclude '^https://(www\.|blog\.)?lynxcoder\.com\.br'
            "src/**/*.html"
          fail: true

      - name: Build da imagem do site
        run: docker build -f infra/Dockerfile -t lynx-site:ci .

      - name: Build da imagem de manutenção
        run: docker build -f infra/maintenance/Dockerfile -t lynx-maint:ci .

      # A API do /comecar: arranca, responde ao health e recusa envios inválidos.
      - name: Testar a API de onboarding
        run: |
          docker build -t lynx-api:ci api
          docker run -d --name lynx-api-ci -p 3000:3000 lynx-api:ci
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/api/health >/dev/null && break || sleep 1
          done

          echo "— health deve ser 200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health)" = "200"

          echo "— envio sem dados nem fotos deve ser recusado com 400"
          test "$(curl -s -o /dev/null -w '%{http_code}' -F website= http://localhost:3000/api/onboarding)" = "400"

          echo "— ficheiro que nao e imagem deve ser recusado"
          printf 'nao sou imagem' > /tmp/falso.jpg
          curl -s -F fotos=@/tmp/falso.jpg http://localhost:3000/api/onboarding | grep -q '"ok":false'

          echo "— contato valido redireciona para /obrigado.html"
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -d 'nome=Teste CI&email=ci@exemplo.com&mensagem=Mensagem de teste automatico do CI.' http://localhost:3000/api/contato)" = "303 http://localhost:3000/obrigado.html"

          echo "— proposta e formulario sem link valido nao abrem"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/proposta/AAAAAAAAAAAAAAAAAAAAAAAA)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/comecar/AAAAAAAAAAAAAAAAAAAAAAAA)" = "403"

          echo "— painel: so existe no host admin, e pede login"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: admin.lynxcoder.com.br' http://localhost:3000/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: admin.lynxcoder.com.br' http://localhost:3000/adm/entradas)" = "401"
          curl -sI -H 'Host: admin.lynxcoder.com.br' http://localhost:3000/ | grep -iq "x-robots-tag: noindex"

          echo "— blog: host proprio, sem posts ainda, 404 de verdade, RSS e sitemap"
          B='Host: blog.lynxcoder.com.br'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$B" http://localhost:3000/)" = "200"
          curl -s -H "$B" http://localhost:3000/ | grep -q 'Blog da LynxCoder'
          curl -sI -H "$B" http://localhost:3000/ | grep -iq "content-security-policy: default-src 'none'"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$B" http://localhost:3000/post-que-nao-existe)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$B" http://localhost:3000/assets/blog.css)" = "200"
          curl -s -H "$B" http://localhost:3000/rss.xml | grep -q '<rss version="2.0">'
          curl -s -H "$B" http://localhost:3000/sitemap.xml | grep -q '<urlset'
          echo "— blog: as rotas do painel nao existem no host do blog"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$B" http://localhost:3000/adm/entradas)" = "404"
          echo "— posts recentes para a pagina inicial"
          curl -s http://localhost:3000/api/blog/recentes | grep -q '"posts":\[\]'

          docker rm -f lynx-api-ci

      # Confirma no container real aquilo que mais vezes se quebrou aqui:
      # o 404 a devolver 404 (e não a homepage com 200) e os headers nos assets.
      - name: Testar o site servido
        run: |
          docker run -d --name lynx-ci -p 8080:80 lynx-site:ci
          for i in $(seq 1 15); do
            curl -sf http://localhost:8080/ >/dev/null && break || sleep 1
          done

          echo "— homepage deve ser 200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = "200"

          echo "— URL inexistente deve ser 404, nao 200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/nao-existe)" = "404"

          echo "— a pagina 404 deve ter conteudo proprio"
          curl -s http://localhost:8080/nao-existe | grep -q "Esta pagina nao existe\|Esta página não existe"

          echo "— CSP presente na pagina"
          curl -sI http://localhost:8080/ | grep -iq 'content-security-policy'

          echo "— CSP presente tambem nos assets (heranca de add_header)"
          curl -sI http://localhost:8080/assets/css/styles.css | grep -iq 'content-security-policy'

          docker rm -f lynx-ci

      # A manutenção tem de devolver 503 em TUDO, senão o Google desindexa
      # durante uma janela de manutenção.
      - name: Testar a manutenção servida
        run: |
          docker run -d --name lynx-maint-ci -p 8081:80 lynx-maint:ci
          sleep 3

          echo "— raiz deve ser 503"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/)" = "503"

          echo "— qualquer outro caminho tambem deve ser 503"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/servicos)" = "503"

          echo "— o logo tem de sair 200, senao a pagina aparece sem imagem"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/assets/img/logo.png)" = "200"

          echo "— Retry-After presente"
          curl -sI http://localhost:8081/ | grep -iq 'retry-after'

          docker rm -f lynx-maint-ci

      # Páginas dos clientes (lynxsites.com.br): corre o próprio scripts/lynxsites.sh
      # com um getent falso (DNS "a apontar" para 127.0.0.1) e confirma os
      # routers gerados e o nginx a escolher a pasta certa pelo host.
      - name: Testar as páginas dos clientes
        run: |
          docker network create proxy
          sites="$RUNNER_TEMP/lynxsites"
          mkdir -p "$sites/quentinhas/css" "$sites/quentinhas/.git" "$sites/semindex" "$sites/Maiusculas"
          echo '<h1>Quentinhas CI</h1>' > "$sites/quentinhas/index.html"
          echo '<p>sobre</p>' > "$sites/quentinhas/sobre.html"
          echo 'body{}' > "$sites/quentinhas/css/a.css"
          echo 'segredo' > "$sites/quentinhas/.git/config"
          echo 'x' > "$sites/quentinhas/.git/x.js"
          echo '<h1>x</h1>' > "$sites/Maiusculas/index.html"
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\necho "127.0.0.1 STREAM $2"\n' > "$RUNNER_TEMP/bin/getent"
          chmod +x "$RUNNER_TEMP/bin/getent"

          PATH="$RUNNER_TEMP/bin:$PATH" LYNX_SITE_DIR="$GITHUB_WORKSPACE" LYNXSITES_DIR="$sites" LYNXSITES_IP=127.0.0.1 \
            bash scripts/lynxsites.sh 2>&1 | tee /tmp/lynxsites.log

          echo "— só a pasta valida, com index.html, entra"
          grep -q 'https://quentinhas.lynxsites.com.br' /tmp/lynxsites.log
          grep -q 'Ignorado: "Maiusculas"' /tmp/lynxsites.log
          grep -q 'semindex: falta o index.html' /tmp/lynxsites.log
          grep -q 'routers.lynxsites-quentinhas.rule=Host(`quentinhas.lynxsites.com.br`)' infra/lynxsites/clientes.yml
          # "! grep" não falha o passo (comandos negados ficam fora do set -e)
          if grep -q 'semindex\|Maiusculas' infra/lynxsites/clientes.yml; then echo "pasta invalida entrou"; exit 1; fi

          echo "— o container tem os routers do cliente"
          docker inspect lynxsites-paginas --format '{{json .Config.Labels}}' | grep -q 'lynxsites-quentinhas-http'

          for i in $(seq 1 15); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' lynxsites-paginas)" = healthy ] && break || sleep 2
          done
          code() { docker run --rm --network proxy curlimages/curl:8.11.1 -s -o /dev/null -w '%{http_code}' -H "Host: $1" "http://lynxsites-paginas$2"; }
          body() { docker run --rm --network proxy curlimages/curl:8.11.1 -s -H "Host: $1" "http://lynxsites-paginas$2"; }
          hdr() { docker run --rm --network proxy curlimages/curl:8.11.1 -sI -H "Host: $1" "http://lynxsites-paginas$2"; }

          echo "— cada host serve a pasta do seu cliente"
          body quentinhas.lynxsites.com.br / | grep -q 'Quentinhas CI'
          test "$(code quentinhas.lynxsites.com.br /sobre)" = "200"
          test "$(code naoexiste.lynxsites.com.br /)" = "404"
          test "$(code outro-dominio.com /)" = "404"

          echo "— ficheiros escondidos nunca saem (nem com extensao de asset)"
          test "$(code quentinhas.lynxsites.com.br /.git/config)" = "404"
          test "$(code quentinhas.lynxsites.com.br /.git/x.js)" = "404"

          echo "— cabecalhos tambem nos assets"
          hdr quentinhas.lynxsites.com.br /css/a.css | grep -iq "frame-ancestors"

          echo "— lynxsites.com.br mostra a apresentacao e www redireciona"
          body lynxsites.com.br / | grep -q 'Páginas criadas pela LynxCoder'
          test "$(code lynxsites.com.br /logo.png)" = "200"
          hdr www.lynxsites.com.br /x | grep -iq '^location: https://lynxsites.com.br/x'

          docker rm -f lynxsites-paginas

      # Não falha o build: é só um aviso visível enquanto os pendentes do
      # README não estiverem fechados.
      - name: Avisar sobre placeholders pendentes
        continue-on-error: true
        run: |
          if grep -rq 'YOUR_FORM_ID' src/; then
            echo "::warning::O formulario ainda tem YOUR_FORM_ID — ver docs/runbook.md"
          fi
          if [ ! -f src/favicon.ico ]; then
            echo "::warning::src/favicon.ico nao existe — ver docs/runbook.md › Assets a gerar"
          fi

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Servir e medir
        run: |
          docker build -f infra/Dockerfile -t lynx-site:lh .
          docker run -d --name lynx-lh -p 8080:80 lynx-site:lh
          for i in $(seq 1 15); do
            curl -sf http://localhost:8080/ >/dev/null && break || sleep 1
          done
          npx --yes @lhci/cli@0.14.x autorun \
            --collect.url=http://localhost:8080/ \
            --collect.numberOfRuns=2 \
            --upload.target=filesystem \
            --upload.outputDir=./lhci \
            --assert.assertions.categories:performance=warn \
            --assert.assertions.categories:accessibility=error \
            --assert.assertions.categories:seo=error \
            || true
          docker rm -f lynx-lh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: ./lhci
