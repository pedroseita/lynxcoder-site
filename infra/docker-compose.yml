name: lynxcoder-site
services:
  site:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: lynxcoder-site
    restart: unless-stopped
    # A API cria o volume das bandeiras com o dono certo; por isso arranca primeiro.
    depends_on:
      - onboarding
    volumes:
      # Bandeira de manutenção escrita pela API (painel); aqui só leitura.
      - site-flags:/flags:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      # Nomes de router EXCLUSIVOS deste serviço. Partilhá-los com o modo de
      # manutenção fazia o Traefik descartar um dos dois de forma não-determinística
      # quando ambos estavam no ar (ex.: deploy durante a manutenção).
      - "traefik.http.routers.lynx-site.rule=Host(`lynxcoder.com.br`) || Host(`www.lynxcoder.com.br`)"
      - "traefik.http.routers.lynx-site.entrypoints=websecure"
      - "traefik.http.routers.lynx-site.tls.certresolver=letsencrypt"
      - "traefik.http.routers.lynx-site.middlewares=lynx-hsts,lynx-www-to-apex"
      - "traefik.http.routers.lynx-site.priority=10"
      - "traefik.http.services.lynx-site.loadbalancer.server.port=80"
      # HTTP -> HTTPS
      - "traefik.http.routers.lynx-site-http.rule=Host(`lynxcoder.com.br`) || Host(`www.lynxcoder.com.br`)"
      - "traefik.http.routers.lynx-site-http.entrypoints=web"
      - "traefik.http.routers.lynx-site-http.middlewares=lynx-to-https"
      - "traefik.http.routers.lynx-site-http.priority=10"
      - "traefik.http.middlewares.lynx-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.lynx-to-https.redirectscheme.permanent=true"
      # www -> apex: elimina o conteúdo duplicado em dois hostnames
      - 'traefik.http.middlewares.lynx-www-to-apex.redirectregex.regex=^https://www\.lynxcoder\.com\.br/(.*)'
      - "traefik.http.middlewares.lynx-www-to-apex.redirectregex.replacement=https://lynxcoder.com.br/$${1}"
      - "traefik.http.middlewares.lynx-www-to-apex.redirectregex.permanent=true"
      # HSTS — max-age curto de propósito; subir para 31536000 após validar.
      # Não adicionar stsIncludeSubdomains antes de confirmar HTTPS no blog.
      - "traefik.http.middlewares.lynx-hsts.headers.stsSeconds=300"
    networks:
      - proxy

  # API (formulários /comecar e contato) + painel admin.
  # - lynxcoder.com.br/api/*  -> formulários (priority 20 > 10 do nginx do site).
  #   Durante a manutenção o router da manutenção (100) também apanha /api/,
  #   por isso ninguém envia pedidos com o site em baixo.
  # - admin.lynxcoder.com.br -> painel com login + 2 etapas (routes/admin.js).
  #   Continua no ar durante a manutenção (maintenance-on só derruba o site).
  onboarding:
    build:
      context: ../api
    container_name: lynxcoder-onboarding
    restart: unless-stopped
    environment:
      ADMIN_HOST: admin.lynxcoder.com.br
    env_file:
      # SMTP para o aviso por e-mail. Opcional: sem ficheiro, os pedidos são
      # gravados na mesma, só não chega o e-mail. Ver docs/runbook.md.
      - path: onboarding.env
        required: false
    volumes:
      # NUNCA correr "docker compose down -v": apaga todos os pedidos recebidos.
      - onboarding-data:/data
      - site-flags:/flags
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lynx-api.rule=Host(`lynxcoder.com.br`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.lynx-api.entrypoints=websecure"
      - "traefik.http.routers.lynx-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.lynx-api.priority=20"
      - "traefik.http.routers.lynx-api.middlewares=lynx-api-hsts,lynx-api-ratelimit,lynx-api-body"
      - "traefik.http.routers.lynx-api.service=lynx-api"
      - "traefik.http.services.lynx-api.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.lynx-api-hsts.headers.stsSeconds=300"
      # Travão grosso à frente da API (a API tem o seu limite por IP também).
      - "traefik.http.middlewares.lynx-api-ratelimit.ratelimit.average=30"
      - "traefik.http.middlewares.lynx-api-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.lynx-api-ratelimit.ratelimit.burst=10"
      # 14 ficheiros de até 8 MB + margem; acima disto o Traefik responde 413.
      - "traefik.http.middlewares.lynx-api-body.buffering.maxRequestBodyBytes=125000000"
      # Painel: subdomínio próprio, servido pelo mesmo container.
      - "traefik.http.routers.lynx-admin.rule=Host(`admin.lynxcoder.com.br`)"
      - "traefik.http.routers.lynx-admin.entrypoints=websecure"
      - "traefik.http.routers.lynx-admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.lynx-admin.service=lynx-api"
      - "traefik.http.routers.lynx-admin.middlewares=lynx-api-hsts,lynx-admin-ratelimit,lynx-admin-body"
      - "traefik.http.routers.lynx-admin-http.rule=Host(`admin.lynxcoder.com.br`)"
      - "traefik.http.routers.lynx-admin-http.entrypoints=web"
      - "traefik.http.routers.lynx-admin-http.service=lynx-api"
      - "traefik.http.routers.lynx-admin-http.middlewares=lynx-admin-to-https"
      - "traefik.http.middlewares.lynx-admin-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.lynx-admin-to-https.redirectscheme.permanent=true"
      # O painel carrega várias fotos de uma vez: limite mais largo que o da API.
      - "traefik.http.middlewares.lynx-admin-ratelimit.ratelimit.average=300"
      - "traefik.http.middlewares.lynx-admin-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.lynx-admin-ratelimit.ratelimit.burst=100"
      # 10 MB: as imagens dos posts do blog sobem pelo painel (já reduzidas no navegador).
      - "traefik.http.middlewares.lynx-admin-body.buffering.maxRequestBodyBytes=10485760"
      # Blog próprio (routes/blog.js), servido pelo mesmo container. Fica no ar
      # durante a manutenção do site, como o painel.
      - "traefik.http.routers.lynx-blog.rule=Host(`blog.lynxcoder.com.br`)"
      - "traefik.http.routers.lynx-blog.entrypoints=websecure"
      - "traefik.http.routers.lynx-blog.tls.certresolver=letsencrypt"
      - "traefik.http.routers.lynx-blog.service=lynx-api"
      - "traefik.http.routers.lynx-blog.middlewares=lynx-api-hsts,lynx-blog-ratelimit"
      - "traefik.http.routers.lynx-blog-http.rule=Host(`blog.lynxcoder.com.br`)"
      - "traefik.http.routers.lynx-blog-http.entrypoints=web"
      - "traefik.http.routers.lynx-blog-http.service=lynx-api"
      - "traefik.http.routers.lynx-blog-http.middlewares=lynx-admin-to-https"
      - "traefik.http.middlewares.lynx-blog-ratelimit.ratelimit.average=300"
      - "traefik.http.middlewares.lynx-blog-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.lynx-blog-ratelimit.ratelimit.burst=100"
    networks:
      - proxy

volumes:
  onboarding-data:
  site-flags:

networks:
  proxy:
    external: true
