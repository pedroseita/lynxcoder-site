name: lynxcoder-site
services:
  site:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: lynxcoder-site
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      # Nomes de router EXCLUSIVOS deste serviço. Partilhá-los com o modo de
      # manutenção fazia o Traefik descartar um dos dois de forma não-determinística
      # quando ambos estavam no ar (ex.: deploy durante a manutenção).
      - "traefik.http.routers.lynx-site.rule=Host(`lynxcoder.com.br`) || Host(`www.lynxcoder.com.br`)"
      - "traefik.http.routers.lynx-site.entrypoints=websecure"
      - "traefik.http.routers.lynx-site.tls.certresolver=letsencrypt"
      - "traefik.http.routers.lynx-site.middlewares=lynx-hsts,lynx-www-to-apex"
      - "traefik.http.routers.lynx-site.priority=10"
      - "traefik.http.services.lynx-site.loadbalancer.server.port=80"
      # HTTP -> HTTPS
      - "traefik.http.routers.lynx-site-http.rule=Host(`lynxcoder.com.br`) || Host(`www.lynxcoder.com.br`)"
      - "traefik.http.routers.lynx-site-http.entrypoints=web"
      - "traefik.http.routers.lynx-site-http.middlewares=lynx-to-https"
      - "traefik.http.routers.lynx-site-http.priority=10"
      - "traefik.http.middlewares.lynx-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.lynx-to-https.redirectscheme.permanent=true"
      # www -> apex: elimina o conteúdo duplicado em dois hostnames
      - "traefik.http.middlewares.lynx-www-to-apex.redirectregex.regex=^https://www\.lynxcoder\.com\.br/(.*)"
      - "traefik.http.middlewares.lynx-www-to-apex.redirectregex.replacement=https://lynxcoder.com.br/$${1}"
      - "traefik.http.middlewares.lynx-www-to-apex.redirectregex.permanent=true"
      # HSTS — max-age curto de propósito; subir para 31536000 após validar.
      # Não adicionar stsIncludeSubdomains antes de confirmar HTTPS no blog.
      - "traefik.http.middlewares.lynx-hsts.headers.stsSeconds=300"
    networks:
      - proxy

networks:
  proxy:
    external: true
