# lynxsites.com.br/criar: a compra, com CSP estrita (só ficheiros próprios e o
# Turnstile da Cloudflare). Repete os cabeçalhos base: um add_header dentro de
# um location anula os do server. As duas CSP valem ao mesmo tempo.
include /etc/nginx/snippets/lynxsites-headers.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; form-action 'self'" always;
add_header Cache-Control "no-cache" always;
