# Cabeçalhos das páginas dos clientes. Mais largos que os do lynxcoder.com.br:
# cada página pode usar fontes, mapas ou scripts de terceiros, por isso aqui
# não há CSP de script-src. frame-ancestors deixa o portfólio mostrá-las num iframe.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "frame-ancestors 'self' https://lynxcoder.com.br; object-src 'none'; base-uri 'self'" always;
