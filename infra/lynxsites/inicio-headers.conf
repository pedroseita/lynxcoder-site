# lynxsites.com.br (vitrine): CSP estrita, só ficheiros próprios. O vitrine.js
# lê o preço em /api/criar/catalogo (mesma origem). Repete os cabeçalhos base:
# um add_header dentro de um location anula os do server.
include /etc/nginx/snippets/lynxsites-headers.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; form-action 'self'" always;
add_header Cache-Control "no-cache" always;
