<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lynx Sites · Páginas criadas pela LynxCoder</title>
<meta name="description" content="Endereço das páginas que a LynxCoder cria para pequenos negócios e profissionais.">
<meta name="theme-color" content="#08090b">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<style>
:root{--bg:#08090b;--surface:#111419;--border:rgba(255,255,255,.1);--text:#eef0f3;--dim:#9aa1ad;--accent:#3df0ff;--accent-ink:#04181b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:40px 20px;background:radial-gradient(60% 50% at 50% 0%,rgba(61,240,255,.12),transparent 70%)}
.card{max-width:560px;text-align:center}
img{width:76px;height:auto;filter:drop-shadow(0 0 22px rgba(61,240,255,.25))}
h1{font-size:clamp(30px,6vw,44px);line-height:1.1;margin:18px 0 12px;letter-spacing:-.02em}
p{color:var(--dim);margin:0 0 26px}
.btn{display:inline-block;padding:13px 24px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none}
.btn:focus-visible{outline:3px solid var(--text);outline-offset:3px}
small{display:block;margin-top:36px;color:var(--dim);font-size:14px}
small a{color:var(--text)}
</style>
</head>
<body>
<main>
  <div class="card">
    <img src="/logo.png" alt="LynxCoder" width="76" height="90">
    <h1>Páginas criadas pela LynxCoder</h1>
    <p>Este endereço reúne as páginas que fazemos para pequenos negócios e profissionais. Quer uma para o seu?</p>
    <a class="btn" href="https://lynxcoder.com.br/#contato">Quero uma página</a>
    <small>Conheça a <a href="https://lynxcoder.com.br">LynxCoder</a></small>
  </div>
</main>
</body>
</html>
