# Qualquer host que não seja um dos de baixo (e o healthcheck por 127.0.0.1).
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
    location / { return 404; }
}

server {
    listen 80;
    server_name www.lynxsites.com.br;
    server_tokens off;
    return 301 https://lynxsites.com.br$request_uri;
}

# lynxsites.com.br: página de apresentação, servida da imagem.
server {
    listen 80;
    server_name lynxsites.com.br;
    server_tokens off;
    root /usr/share/nginx/inicio;
    index index.html;
    include /etc/nginx/snippets/lynxsites-headers.conf;
    location / { try_files $uri $uri/ =404; }
}

# <cliente>.lynxsites.com.br -> /srv/sites/<cliente>/ (pasta montada do VPS).
# O nome já vem validado pela regex: sem pontos nem barras, não sai da pasta.
server {
    listen 80;
    # Entre aspas: sem elas o nginx lê as chavetas de {0,61} como um bloco.
    server_name "~^(?<cliente>[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)\.lynxsites\.com\.br$";
    server_tokens off;
    root /srv/sites/$cliente;
    index index.html;
    include /etc/nginx/snippets/lynxsites-headers.conf;

    # Ficheiros escondidos (.git, .env…) nunca são servidos. Primeiro: as regex
    # são avaliadas por ordem e /.git/x.js cairia na regra dos .js.
    location ~ /\. { return 404; }

    # Repetir o include: um add_header dentro do location anula os do server.
    location ~* \.(css|js)$ {
        include /etc/nginx/snippets/lynxsites-headers.conf;
        expires epoch;
    }
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2|webp|avif)$ {
        include /etc/nginx/snippets/lynxsites-headers.conf;
        expires 7d;
    }
    location / { try_files $uri $uri.html $uri/ =404; }
}
