server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/snippets/security-headers.conf;
    server_tokens off;

    # O logo precisa de sair com 200, senão a própria página de manutenção
    # aparece sem imagem.
    location = /logo.png {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
    }
    location = /favicon.ico {
        include /etc/nginx/snippets/security-headers.conf;
        alias /usr/share/nginx/html/logo.png;
        expires 30d;
    }

    # Qualquer outro caminho devolve a página de manutenção com HTTP 503 e
    # Retry-After. É isto que diz ao Google "volta mais tarde" em vez de
    # "esta página desapareceu" — um 404 ou um 200 aqui custava indexação.
    error_page 503 /index.html;
    location = /index.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
    }
    location / {
        return 503;
    }
}
