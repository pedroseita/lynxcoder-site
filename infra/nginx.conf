server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;
    server_tokens off;

    # Cache static assets
    # Sem add_header aqui: qualquer add_header num location anula a herança
    # dos headers do bloco server. `expires` já gera Cache-Control.
    # O include tem de ser repetido para os re-declarar neste contexto.
    # CSS e JS mudam a cada deploy e os nomes não levam versão: revalidar
    # sempre (Cache-Control: no-cache + ETag => 304 barato quando não mudou).
    # Com 30 dias, um deploy deixava visitantes com HTML novo e CSS antigo.
    location ~* \.(css|js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires epoch;
    }

    # Fontes e imagens quase nunca mudam: cache longo.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Healthcheck do container: responde sempre 200, com ou sem manutenção.
    # (Se o healthcheck usasse "/", a manutenção (503) deixava o container
    # "unhealthy" e o Traefik deixava de o servir: 404 vazio em vez da página.)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Modo de manutenção ligado pelo painel: a API cria /flags/manutencao no
    # volume partilhado (só leitura aqui). As páginas devolvem 503 + Retry-After,
    # que diz ao Google "volta mais tarde"; assets continuam a ser servidos.
    error_page 503 /manutencao.html;
    location = /manutencao.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
    }

    # Site estático multi-página, sem router client-side: um URL inexistente tem
    # de devolver 404 e não a homepage com 200 (isso gerava soft-404 em todo o
    # domínio e indexava URLs infinitos como duplicado da home).
    # $uri.html: permite URLs sem extensão, ex. /comecar -> comecar.html.
    location / {
        if (-f /flags/manutencao) { return 503; }
        try_files $uri $uri.html $uri/ =404;
    }
}
