server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;
    server_tokens off;

    # Cache static assets
    # Sem add_header aqui: qualquer add_header num location anula a herança
    # dos headers do bloco server. `expires` já gera Cache-Control.
    # O include tem de ser repetido para os re-declarar neste contexto.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Site estático multi-página, sem router client-side: um URL inexistente tem
    # de devolver 404 e não a homepage com 200 (isso gerava soft-404 em todo o
    # domínio e indexava URLs infinitos como duplicado da home).
    location / {
        try_files $uri $uri/ =404;
    }
}
