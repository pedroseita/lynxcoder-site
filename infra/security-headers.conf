# Incluído por infra/nginx.conf e infra/maintenance/nginx.conf.
# Alterar aqui propaga para os dois containers — não copiar estas linhas.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# form-action inclui o Web3Forms: o formulário faz POST nativo do browser,
# por isso connect-src pode continuar 'none' (não há fetch/XHR).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://api.web3forms.com; frame-ancestors 'none';" always;
