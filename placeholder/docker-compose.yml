name: lynxcoder-maintenance
services:
  site:
    build: .
    container_name: lynxcoder-maintenance
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # HTTPS
      - "traefik.http.routers.lynxcoder.rule=Host(`lynxcoder.com.br`) || Host(`www.lynxcoder.com.br`)"
      - "traefik.http.routers.lynxcoder.entrypoints=websecure"
      - "traefik.http.routers.lynxcoder.tls.certresolver=letsencrypt"
      - "traefik.http.routers.lynxcoder.middlewares=lynxcoder-hsts"
      - "traefik.http.services.lynxcoder.loadbalancer.server.port=80"
      # HTTP -> HTTPS
      - "traefik.http.routers.lynxcoder-http.rule=Host(`lynxcoder.com.br`) || Host(`www.lynxcoder.com.br`)"
      - "traefik.http.routers.lynxcoder-http.entrypoints=web"
      - "traefik.http.routers.lynxcoder-http.middlewares=lynxcoder-to-https"
      - "traefik.http.middlewares.lynxcoder-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.lynxcoder-to-https.redirectscheme.permanent=true"
      # HSTS — max-age curto de propósito; subir para 31536000 após validar.
      # Não adicionar stsIncludeSubdomains antes de confirmar HTTPS no blog.
      - "traefik.http.middlewares.lynxcoder-hsts.headers.stsSeconds=300"
    networks:
      - proxy

networks:
  proxy:
    external: true
